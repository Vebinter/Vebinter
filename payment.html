<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Оплата SecureShield</title>
<style>
body{font-family:Arial;background:#1a1a2e;color:#eee;padding:40px;text-align:center}

.btn{background:#4ecca3;color:#000;border:none;padding:15px 30px;border-radius:8px;font-size:18px;cursor:pointer}
.btn:hover{background:#38b28a}
.ok{color:#4ecca3;margin-top:10px;display:none}
h1{color:#4ecca3}
ul{text-align:left;margin-top:30px}

</style>
</head>
<body>
<h1>💳 Оплата SecureShield</h1>
<div class="card">
<h2>Карта ЦУПИС</h2>

</div>
<ul>
<li>💳 Карта ЦУПИС: <b>2204 1801 2541 2346</b></li>
<li>🏦 Сбербанк, Тинькофф, ЮMoney</li>
<li>₿ Криптовалюта (USDT, BTC)</li>
</ul>
<script>
function copyCard(){navigator.clipboard.writeText('2204180125412346');document.getElementById('msg').style.display='block';setTimeout(function(){document.getElementById('msg').style.display='none'},3000)}
</script>
<p style="color:#888;margin-top:40px">© 2026 Олег Беляев</p>

</html>
